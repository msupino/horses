<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>האם הסוס צריך קובן הלילה?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px; max-width: 420px; width: 100%; text-align: center; }
  h1 { font-size: 1.4rem; margin-bottom: 6px; }
  .sub { font-size: 0.75rem; color: #64748b; margin-bottom: 28px; }
  .horse { font-size: 4rem; margin-bottom: 20px; }
  .question { font-size: 0.95rem; margin-bottom: 16px; color: #cbd5e1; }
  .coat-selector { margin-bottom: 24px; }
  .coat-label { font-size: 0.8rem; color: #94a3b8; margin-bottom: 12px; }
  .coat-slider { position: relative; padding: 0 4px; }
  .coat-slider input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; background: linear-gradient(to right, #3b82f6, #60a5fa, #fbbf24, #f97316); outline: none; cursor: pointer; }
  .coat-slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #e2e8f0; border: 3px solid #3b82f6; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3); transition: border-color 0.2s; }
  .coat-slider input[type=range]::-moz-range-thumb { width: 24px; height: 24px; border-radius: 50%; background: #e2e8f0; border: 3px solid #3b82f6; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  .coat-stops { display: flex; justify-content: space-between; margin-top: 8px; }
  .coat-stop { font-size: 0.65rem; color: #64748b; text-align: center; flex: 1; transition: color 0.2s, font-weight 0.2s; }
  .coat-stop.active { color: #60a5fa; font-weight: 700; }
  .coat-info { margin-top: 10px; font-size: 0.75rem; color: #94a3b8; min-height: 20px; }
  .result { display: none; margin-top: 20px; padding: 20px; border-radius: 12px; }
  .result.yes { background: #422006; border: 1px solid #92400e; }
  .result.no { background: #052e16; border: 1px solid #166534; }
  .result .icon { font-size: 3rem; margin-bottom: 8px; }
  .result .answer { font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
  .result.yes .answer { color: #fbbf24; }
  .result.no .answer { color: #4ade80; }
  .result .details { font-size: 0.8rem; color: #94a3b8; line-height: 1.8; }
  .temp-display { font-size: 0.85rem; color: #94a3b8; margin-bottom: 20px; min-height: 24px; line-height: 1.8; }
  .temp-display .deg { font-size: 1.1rem; font-weight: 700; color: #60a5fa; }
  .loading { color: #64748b; font-size: 0.8rem; }
  .error { color: #f87171; font-size: 0.8rem; }

  .forecast { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px; max-width: 420px; width: 100%; margin-top: 16px; }
  .forecast h2 { font-size: 1.1rem; margin-bottom: 16px; text-align: center; }
  .forecast-grid { display: flex; flex-direction: column; gap: 8px; }
  .forecast-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 10px 14px; border-radius: 10px; background: #0f172a; border: 1px solid #334155; font-size: 0.82rem; }
  .forecast-day { font-weight: 600; flex: 1 1 60px; min-width: 60px; }
  .forecast-temps { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .forecast-temps .lo { color: #60a5fa; font-weight: 600; }
  .forecast-icon { font-size: 1.2rem; flex-shrink: 0; min-width: 24px; text-align: center; }
  .forecast-blanket { font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .blanket-yes { background: #422006; color: #fbbf24; border: 1px solid #92400e; }
  .blanket-no { background: #052e16; color: #4ade80; border: 1px solid #166534; }
  .wrapper { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 420px; }
</style>
</head>
<body>
<div class="wrapper">
<div class="card">
  <div class="horse">🐴</div>
  <h1>האם הסוס צריך קובן הלילה?</h1>
  <div class="sub">חוות איפונה</div>

  <div class="temp-display" id="temp-display">
    <span class="loading">בודק תחזית...</span>
  </div>

  <div id="question-section">
    <div class="question">סוג הפרווה</div>
    <div class="coat-selector">
      <div class="coat-slider">
        <input type="range" id="coat-range" min="0" max="3" step="1" value="0" oninput="onCoatChange(this.value)">
      </div>
      <div class="coat-stops">
        <span class="coat-stop active" id="stop-0">מגולח</span>
        <span class="coat-stop" id="stop-1">קצר</span>
        <span class="coat-stop" id="stop-2">ארוך</span>
        <span class="coat-stop" id="stop-3">חורפי</span>
      </div>
      <div class="coat-info" id="coat-info">סף: מתחת ל-15°C — ללא שכבת בידוד</div>
    </div>
  </div>

  <div class="result" id="result"></div>
</div>

<div class="forecast" id="forecast">
  <h2>תחזית ל-7 ימים הקרובים</h2>
  <div class="forecast-grid" id="forecast-grid">
    <span class="loading">טוען תחזית...</span>
  </div>
</div>
</div>

<script>
const LAT = 32.18, LON = 34.88;
let minTemp = null;
let minFeelsLike = null;
let minTime = null;
let currentTemp = null;
let cachedDaily = null;
let cachedHourlyTimes = null;
let cachedHourlyTemps = null;
let coatType = 0;

const COAT_TYPES = [
  { name: 'מגולח', threshold: 15, desc: 'סף: מתחת ל-15°C — ללא שכבת בידוד' },
  { name: 'קצר', threshold: 10, desc: 'סף: מתחת ל-10°C — בידוד חלקי' },
  { name: 'ארוך', threshold: 5, desc: 'סף: מתחת ל-5°C — בידוד טוב' },
  { name: 'חורפי', threshold: 0, desc: 'סף: מתחת ל-0°C — בידוד מלא' },
];

const DAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const WEATHER_ICONS = {
  0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
  45: '🌫️', 48: '🌫️',
  51: '🌦️', 53: '🌦️', 55: '🌧️',
  61: '🌧️', 63: '🌧️', 65: '🌧️',
  71: '🌨️', 73: '🌨️', 75: '🌨️',
  80: '🌦️', 81: '🌧️', 82: '🌧️',
  95: '⛈️', 96: '⛈️', 99: '⛈️',
};

const MODELS = [
  { name: 'Best Match', url: `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&hourly=temperature_2m,apparent_temperature&daily=temperature_2m_max,temperature_2m_min,weathercode&current_weather=true&timezone=Asia/Jerusalem&forecast_days=8` },
  { name: 'GFS', url: `https://api.open-meteo.com/v1/gfs?latitude=${LAT}&longitude=${LON}&hourly=temperature_2m,apparent_temperature&daily=temperature_2m_max,temperature_2m_min,weathercode&current_weather=true&timezone=Asia/Jerusalem&forecast_days=8` },
  { name: 'ECMWF', url: `https://api.open-meteo.com/v1/ecmwf?latitude=${LAT}&longitude=${LON}&hourly=temperature_2m,apparent_temperature&daily=temperature_2m_max,temperature_2m_min&timezone=Asia/Jerusalem&forecast_days=8` },
];

let modelResults = [];

async function fetchForecast() {
  const display = document.getElementById('temp-display');
  try {
    const fetches = MODELS.map(m => fetch(m.url).then(r => r.json()).catch(() => null));
    const results = await Promise.all(fetches);
    modelResults = [];

    let primaryData = null;
    for (let mi = 0; mi < results.length; mi++) {
      const data = results[mi];
      if (!data || !data.hourly) continue;
      if (!primaryData) primaryData = data;

      const times = data.hourly.time;
      const temps = data.hourly.temperature_2m;
      const feelsLike = data.hourly.apparent_temperature || temps;
      const now = new Date();
      const tomorrow7am = new Date(now);
      tomorrow7am.setDate(tomorrow7am.getDate() + 1);
      tomorrow7am.setHours(7, 0, 0, 0);

      let mMin = Infinity, mMinFL = Infinity, mTime = '';
      for (let i = 0; i < times.length; i++) {
        const t = new Date(times[i]);
        if (t >= now && t <= tomorrow7am) {
          if (feelsLike[i] < mMinFL) {
            mMinFL = feelsLike[i];
            mMin = temps[i];
            mTime = times[i].slice(11, 16);
          }
        }
      }
      if (mMinFL < Infinity) {
        modelResults.push({
          name: MODELS[mi].name,
          min: mMin,
          minFL: mMinFL,
          time: mTime,
          hourlyTimes: times,
          hourlyTemps: temps,
          hourlyFeelsLike: feelsLike,
          daily: data.daily,
        });
      }
    }

    if (!modelResults.length) {
      display.innerHTML = '<span class="error">אין נתוני תחזית זמינים</span>';
      return;
    }

    currentTemp = primaryData.current_weather ? primaryData.current_weather.temperature : modelResults[0].min;
    minTemp = Math.round(modelResults.reduce((s, m) => s + m.min, 0) / modelResults.length * 10) / 10;
    minFeelsLike = Math.round(modelResults.reduce((s, m) => s + m.minFL, 0) / modelResults.length * 10) / 10;
    minTime = modelResults[0].time;

    cachedDaily = primaryData.daily;
    cachedHourlyTimes = primaryData.hourly.time;
    cachedHourlyTemps = primaryData.hourly.time.map((_, i) => {
      let sum = 0, cnt = 0;
      for (const mr of modelResults) {
        if (i < mr.hourlyFeelsLike.length && mr.hourlyFeelsLike[i] != null) { sum += mr.hourlyFeelsLike[i]; cnt++; }
      }
      return cnt ? Math.round(sum / cnt * 10) / 10 : (primaryData.hourly.apparent_temperature || primaryData.hourly.temperature_2m)[i];
    });

    const modelDetail = modelResults.map(m => `${m.name}: ${m.minFL}°C`).join(' · ');
    const flDiff = minFeelsLike < minTemp ? ` (מרגיש כמו <span class="deg">${minFeelsLike}°C</span>)` : '';
    display.innerHTML =
      `כרגע: <span class="deg">${currentTemp}°C</span><br>` +
      `מינימום עד 07:00: <span class="deg">${minTemp}°C</span>${flDiff}<br>` +
      `<span style="font-size:0.65rem;color:#64748b">מרגיש כמו — ${modelDetail}</span>`;

  } catch (e) {
    display.innerHTML = '<span class="error">שגיאה בקבלת מזג האוויר. נסה לרענן.</span>';
  }
}

function overnightMin(dayDateStr, hourlyTimes, hourlyTemps) {
  const eveningStart = new Date(dayDateStr + 'T18:00:00');
  const morningEnd = new Date(eveningStart);
  morningEnd.setDate(morningEnd.getDate() + 1);
  morningEnd.setHours(7, 0, 0, 0);

  let lo = Infinity;
  for (let i = 0; i < hourlyTimes.length; i++) {
    const t = new Date(hourlyTimes[i]);
    if (t >= eveningStart && t <= morningEnd) {
      if (hourlyTemps[i] < lo) lo = hourlyTemps[i];
    }
  }
  return lo === Infinity ? null : lo;
}

function avgOvernightMin(dayDateStr) {
  let sum = 0, cnt = 0;
  for (const mr of modelResults) {
    const lo = overnightMin(dayDateStr, mr.hourlyTimes, mr.hourlyFeelsLike);
    if (lo !== null) { sum += lo; cnt++; }
  }
  return cnt ? Math.round(sum / cnt * 10) / 10 : null;
}

function renderWeeklyForecast() {
  if (!cachedDaily) return;
  const grid = document.getElementById('forecast-grid');
  const dates = cachedDaily.time;
  const minTemps = cachedDaily.temperature_2m_min;
  const codes = cachedDaily.weathercode;
  const threshold = COAT_TYPES[coatType].threshold;

  let html = '';
  for (let i = 1; i < dates.length - 1; i++) {
    const d = new Date(dates[i] + 'T00:00:00');
    const dayName = 'ליל ' + DAY_NAMES[d.getDay()];
    const icon = codes ? (WEATHER_ICONS[codes[i]] || '🌡️') : '🌡️';
    const avgLo = avgOvernightMin(dates[i]);
    const lo = avgLo !== null ? avgLo : minTemps[i];

    const needsBlanket = Math.floor(lo) <= threshold;
    const blanketHtml = needsBlanket
      ? '<span class="forecast-blanket blanket-yes">צריך קובן</span>'
      : '<span class="forecast-blanket blanket-no">בלי קובן</span>';

    html += `
      <div class="forecast-row">
        <span class="forecast-day">${dayName}</span>
        <span class="forecast-icon">${icon}</span>
        <span class="forecast-temps">
          <span class="lo">${lo}°</span>
        </span>
        ${blanketHtml}
      </div>`;
  }
  grid.innerHTML = html;
}

function onCoatChange(val) {
  coatType = parseInt(val);
  for (let i = 0; i < 4; i++) {
    document.getElementById('stop-' + i).classList.toggle('active', i === coatType);
  }
  document.getElementById('coat-info').textContent = COAT_TYPES[coatType].desc;

  renderWeeklyForecast();

  if (minFeelsLike === null || minFeelsLike === Infinity) return;

  const coat = COAT_TYPES[coatType];
  const effectiveTemp = minFeelsLike;
  const needsBlanket = Math.floor(effectiveTemp) <= coat.threshold;
  const el = document.getElementById('result');
  const flNote = minFeelsLike < minTemp ? `<br>מרגיש כמו: ${minFeelsLike}°C (רוח + לחות)` : '';

  if (needsBlanket) {
    el.className = 'result yes';
    el.innerHTML =
      `<div class="icon">🧣</div>` +
      `<div class="answer">כן, צריך קובן!</div>` +
      `<div class="details">` +
        `מינימום הלילה: ${minTemp}°C${flNote}<br>` +
        `פרווה: ${coat.name} — סף: מתחת ל-${coat.threshold}°C` +
      `</div>`;
  } else {
    el.className = 'result no';
    el.innerHTML =
      `<div class="icon">✨</div>` +
      `<div class="answer">לא צריך קובן</div>` +
      `<div class="details">` +
        `מינימום הלילה: ${minTemp}°C${flNote}<br>` +
        `פרווה: ${coat.name} — סף: מתחת ל-${coat.threshold}°C` +
      `</div>`;
  }
  el.style.display = 'block';
}

// Auto-trigger on load once forecast is ready
const _origFetch = fetchForecast;
fetchForecast = async function() {
  await _origFetch();
  onCoatChange(document.getElementById('coat-range').value);
};

fetchForecast();
</script>
</body>
</html>
